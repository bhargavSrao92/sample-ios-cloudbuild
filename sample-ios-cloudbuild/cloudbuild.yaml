steps:
  - name: 'macos-xcode-runner'
    entrypoint: bash
    args:
      - -c
      - |
        xcodebuild clean \
        -workspace MySampleApp.xcworkspace \
        -scheme MySampleApp

        xcodebuild archive \
        -workspace MySampleApp.xcworkspace \
        -scheme MySampleApp \
        -configuration Release \
        -archivePath build/MySampleApp.xcarchive

        xcodebuild -exportArchive \
        -archivePath build/MySampleApp.xcarchive \
        -exportOptionsPlist ExportOptions.plist \
        -exportPath build/output

artifacts:
  objects:
    location: gs://my-ios-build-artifacts/builds/
    paths:
      - build/output/*.ipa

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
