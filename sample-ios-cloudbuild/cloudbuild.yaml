steps:
  - name: 'macos-builder-image'
    entrypoint: bash
    args:
      - -c
      - |
        xcodebuild clean \
        -project MySampleApp.xcodeproj \
        -scheme MySampleApp

        xcodebuild archive \
        -project MySampleApp.xcodeproj \
        -scheme MySampleApp \
        -archivePath build/MySampleApp.xcarchive

        xcodebuild -exportArchive \
        -archivePath build/MySampleApp.xcarchive \
        -exportPath build/output \
        -exportOptionsPlist ExportOptions.plist

options:
  logging: CLOUD_LOGGING_ONLY

artifacts:
  objects:
    location: gs://my-ios-build-artifacts/builds/
    paths:
      - build/output/*.ipa
