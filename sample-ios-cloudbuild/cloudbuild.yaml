steps:
  - name: 'ubuntu'
    entrypoint: bash
    args:
      - -c
      - |
        echo "===== Build Started ====="

        pwd

        echo "===== Repository Contents ====="
        ls -la

        mkdir -p build/output

        echo "Sample build successful" > build/output/build-status.txt

        echo "===== Build Complete ====="

options:
  logging: CLOUD_LOGGING_ONLY

artifacts:
  objects:
    location: gs://my-ios-build-artifacts/builds/
    paths:
      - build/output/*
